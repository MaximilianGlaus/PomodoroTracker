name: tests

# When to run this workflow.
on:
  push:                      # every push to any branch
  pull_request:              # and every pull request

jobs:
  pytest:
    # The machine GitHub spins up for us. ubuntu is the cheapest/fastest.
    runs-on: ubuntu-latest

    steps:
      # 1. Copy the repository onto that machine.
      - uses: actions/checkout@v4

      # 2. Install Python. 3.11 matches local development.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install only what the tests need. PyInstaller is a packaging tool,
      #    irrelevant to CI, so we install pytest directly rather than the whole
      #    requirements-dev.txt (which pins macOS-only packages like macholib).
      - name: Install pytest
        run: python -m pip install pytest

      # 4. Run the suite. A non-zero exit code fails the job and marks the
      #    commit with a red X on GitHub.
      - name: Run tests
        run: python -m pytest -v
